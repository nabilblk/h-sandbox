services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harakiri
      POSTGRES_USER: harakiri
      POSTGRES_PASSWORD: harakiri
    ports:
      - "15432:5432"
    volumes:
      - harakiri-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harakiri"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--hostname-strict=false", "--http-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

volumes:
  harakiri-postgres:

