packages:
  - "apps/*"
  - "packages/*"
  - "integrations/openwebui"
allowBuilds:
  esbuild: true
  sharp: true
# Security floors for vulnerable transitive releases. Remove an override when
# the upstream dependency tree resolves above its affected range without it.
overrides:
  "zod@>=4.0.0 <4.6.6": "4.6.6"
  "vite@>=7.0.0 <7.3.7": "7.3.7"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "ip-address@>=10.0.0 <10.3.1": "10.3.1"
  "browserslist@>=4.0.0 <4.28.7": "4.28.7"
  "baseline-browser-mapping@>=2.0.0 <2.11.0": "2.11.0"
  "@babel/core@>=7.0.0 <7.29.1": "7.29.6"
  "esbuild@>=0.28.0 <0.28.1": "0.28.2"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
