apiVersion: v1
kind: Secret
metadata:
  name: platform-postgres
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  POSTGRESQL_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRESQL_ADMIN_PASSWORD: "${POSTGRES_ADMIN_PASSWORD}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-postgres-data
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: ${POSTGRES_STORAGE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-postgres
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: platform-postgres
    app.kubernetes.io/part-of: harakiri-security
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-postgres
        app.kubernetes.io/part-of: harakiri-security
    spec:
      imagePullSecrets:
        - name: registry-pull
      containers:
        - name: postgres
          image: ${POSTGRES_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_USER
              value: platform_admin
            - name: POSTGRESQL_DATABASE
              value: platform
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-postgres
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-postgres
                  key: POSTGRESQL_ADMIN_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: platform-postgres
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: platform-postgres
    app.kubernetes.io/part-of: harakiri-security
spec:
  selector:
    app.kubernetes.io/name: platform-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
