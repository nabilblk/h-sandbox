apiVersion: v1
kind: Namespace
metadata:
  name: harakiri-preview
  labels:
    app.kubernetes.io/part-of: harakiri-preview
---
apiVersion: v1
kind: Namespace
metadata:
  name: harakiri-preview-runtime
  labels:
    app.kubernetes.io/part-of: harakiri-preview
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: preview-postgres
  namespace: harakiri-preview
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-postgres
  namespace: harakiri-preview
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: preview-postgres}
  template:
    metadata:
      labels: {app: preview-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16.15-alpine
          envFrom:
            - secretRef: {name: preview-postgres}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: preview-postgres}
        - name: init
          secret:
            secretName: preview-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: preview-postgres
  namespace: harakiri-preview
spec:
  selector: {app: preview-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-keycloak
  namespace: harakiri-preview
spec:
  replicas: 1
  selector:
    matchLabels: {app: preview-keycloak}
  template:
    metadata:
      labels: {app: preview-keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3
          args: [start, --import-realm, --http-enabled=true, --health-enabled=true]
          envFrom:
            - secretRef: {name: preview-keycloak}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health/ready, port: management}
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 5
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          secret:
            secretName: preview-realm
---
apiVersion: v1
kind: Service
metadata:
  name: preview-keycloak
  namespace: harakiri-preview
spec:
  selector: {app: preview-keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
