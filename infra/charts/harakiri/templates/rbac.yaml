{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "harakiri.fullname" . }}-template-builder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harakiri.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "harakiri.fullname" . }}-template-builder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harakiri.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harakiri.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "harakiri.fullname" . }}-template-builder
{{- end }}
{{- if .Values.rbac.create }}
{{- $root := . }}
{{- $runtimeNamespaces := list .Values.config.TEMPLATE_RUNTIME_PULL_PREFLIGHT_NAMESPACE .Values.config.TEMPLATE_IMAGE_PREPULL_NAMESPACE | compact | uniq }}
{{- range $namespace := $runtimeNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "harakiri.fullname" $root }}-template-runtime
  namespace: {{ $namespace }}
  labels:
    {{- include "harakiri.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "harakiri.fullname" $root }}-template-runtime
  namespace: {{ $namespace }}
  labels:
    {{- include "harakiri.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harakiri.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "harakiri.fullname" $root }}-template-runtime
{{- end }}
{{- end }}
{{- if and .Values.rbac.create .Values.rbac.prepullClusterRole }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "harakiri.fullname" . }}-template-prepull
  labels:
    {{- include "harakiri.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "harakiri.fullname" . }}-template-prepull
  labels:
    {{- include "harakiri.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harakiri.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "harakiri.fullname" . }}-template-prepull
{{- end }}
