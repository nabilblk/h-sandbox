{{- $external := .Values.credentialVault.externalSecrets.kubernetes -}}
{{- if and .Values.rbac.create $external.enabled -}}
{{- $namespaces := compact $external.allowedNamespaces -}}
{{- $allowedNames := compact $external.allowedNames -}}
{{- $allowedNamePrefixes := compact $external.allowedNamePrefixes -}}
{{- if eq (len $namespaces) 0 -}}
{{- $namespaces = list .Release.Namespace -}}
{{- end -}}
{{- range $index, $namespace := $namespaces }}
{{- if gt $index 0 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "harakiri.fullname" $ }}-external-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "harakiri.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    {{- if and (gt (len $allowedNames) 0) (eq (len $allowedNamePrefixes) 0) }}
    resourceNames:
      {{- toYaml $allowedNames | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "harakiri.fullname" $ }}-external-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "harakiri.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "harakiri.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "harakiri.fullname" $ }}-external-secrets
{{- end }}
{{- end }}
