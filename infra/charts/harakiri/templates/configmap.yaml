{{- $cfg := merge (deepCopy .Values.extraConfig) .Values.config -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString .Values.usage.retentionDays))) (lt (int .Values.usage.retentionDays) 1) (gt (int .Values.usage.retentionDays) 30) -}}
{{- fail "usage.retentionDays must be an integer between 1 and 30" -}}
{{- end -}}
{{- if and .Values.metrics.enabled (or (not .Values.metrics.tokenSecret.name) (not .Values.metrics.tokenSecret.key)) -}}
{{- fail "metrics.tokenSecret.name and key are required for private metrics" -}}
{{- end -}}
{{- if and .Values.metrics.enabled (or (not (regexMatch "^[0-9]+$" (toString .Values.metrics.port))) (lt (int .Values.metrics.port) 1024) (gt (int .Values.metrics.port) 65535) (eq (int .Values.metrics.port) 8080)) -}}
{{- fail "metrics.port must be an integer between 1024 and 65535, distinct from API port 8080" -}}
{{- end -}}
{{- $_ := set $cfg "USAGE_OBSERVER_ENABLED" (ternary "1" "0" .Values.usage.observerEnabled) -}}
{{- $_ := set $cfg "USAGE_HISTORY_RETENTION_DAYS" (toString .Values.usage.retentionDays) -}}
{{- $_ := set $cfg "OPERATOR_METRICS_ENABLED" (ternary "1" "0" .Values.metrics.enabled) -}}
{{- $_ := set $cfg "OPERATOR_METRICS_HOST" .Values.metrics.host -}}
{{- $_ := set $cfg "OPERATOR_METRICS_PORT" (toString .Values.metrics.port) -}}
{{- /* Default the builder Job image to the deployed api image. */ -}}
{{- if not (index $cfg "TEMPLATE_BUILDER_JOB_IMAGE") -}}
{{- $_ := set $cfg "TEMPLATE_BUILDER_JOB_IMAGE" (include "harakiri.image.api" .) -}}
{{- end -}}
{{- /* Default the template push registry to the chart's in-cluster registry Service. */ -}}
{{- if and .Values.registry.enabled (not (index $cfg "TEMPLATE_REGISTRY_PUSH_HOST")) -}}
{{- $_ := set $cfg "TEMPLATE_REGISTRY_PUSH_HOST" (printf "%s-registry.%s.svc.cluster.local:%v" (include "harakiri.fullname" .) .Release.Namespace .Values.registry.port) -}}
{{- end -}}
{{- $external := .Values.credentialVault.externalSecrets.kubernetes -}}
{{- $externalDefaultNamespace := default .Release.Namespace $external.defaultNamespace -}}
{{- $externalNamespaces := compact $external.allowedNamespaces -}}
{{- if eq (len $externalNamespaces) 0 -}}
{{- $externalNamespaces = list .Release.Namespace -}}
{{- end -}}
{{- if not (hasKey $cfg "EXTERNAL_SECRET_KUBERNETES_ENABLED") -}}
{{- $_ := set $cfg "EXTERNAL_SECRET_KUBERNETES_ENABLED" (ternary "1" "0" $external.enabled) -}}
{{- end -}}
{{- if not (hasKey $cfg "EXTERNAL_SECRET_KUBERNETES_DEFAULT_NAMESPACE") -}}
{{- $_ := set $cfg "EXTERNAL_SECRET_KUBERNETES_DEFAULT_NAMESPACE" $externalDefaultNamespace -}}
{{- end -}}
{{- if not (hasKey $cfg "EXTERNAL_SECRET_KUBERNETES_ALLOWED_NAMESPACES") -}}
{{- $_ := set $cfg "EXTERNAL_SECRET_KUBERNETES_ALLOWED_NAMESPACES" (join "," $externalNamespaces) -}}
{{- end -}}
{{- if not (hasKey $cfg "EXTERNAL_SECRET_KUBERNETES_ALLOWED_NAMES") -}}
{{- $_ := set $cfg "EXTERNAL_SECRET_KUBERNETES_ALLOWED_NAMES" (join "," (compact $external.allowedNames)) -}}
{{- end -}}
{{- if not (hasKey $cfg "EXTERNAL_SECRET_KUBERNETES_ALLOWED_NAME_PREFIXES") -}}
{{- $_ := set $cfg "EXTERNAL_SECRET_KUBERNETES_ALLOWED_NAME_PREFIXES" (join "," (compact $external.allowedNamePrefixes)) -}}
{{- end -}}
{{- $githubApp := .Values.credentialVault.dynamicCredentials.githubApp -}}
{{- if and $githubApp.enabled (not $githubApp.clientId) -}}
{{- fail "credentialVault.dynamicCredentials.githubApp.clientId is required when GitHub App dynamic credentials are enabled" -}}
{{- end -}}
{{- if not (hasKey $cfg "DYNAMIC_GITHUB_APP_ENABLED") -}}
{{- $_ := set $cfg "DYNAMIC_GITHUB_APP_ENABLED" (ternary "1" "0" $githubApp.enabled) -}}
{{- end -}}
{{- if not (hasKey $cfg "DYNAMIC_GITHUB_APP_CLIENT_ID") -}}
{{- $_ := set $cfg "DYNAMIC_GITHUB_APP_CLIENT_ID" $githubApp.clientId -}}
{{- end -}}
{{- if not (hasKey $cfg "DYNAMIC_GITHUB_API_BASE_URL") -}}
{{- $_ := set $cfg "DYNAMIC_GITHUB_API_BASE_URL" $githubApp.apiBaseUrl -}}
{{- end -}}
{{- if not (hasKey $cfg "DYNAMIC_GITHUB_API_VERSION") -}}
{{- $_ := set $cfg "DYNAMIC_GITHUB_API_VERSION" $githubApp.apiVersion -}}
{{- end -}}
{{- if not (hasKey $cfg "DYNAMIC_GITHUB_REQUEST_TIMEOUT_MS") -}}
{{- $_ := set $cfg "DYNAMIC_GITHUB_REQUEST_TIMEOUT_MS" (toString $githubApp.requestTimeoutMs) -}}
{{- end -}}
{{- $encryption := .Values.credentialVault.encryption -}}
{{- if not (hasKey $cfg "CREDENTIAL_VAULT_KEY_ID") -}}
{{- $_ := set $cfg "CREDENTIAL_VAULT_KEY_ID" $encryption.keyId -}}
{{- end -}}
{{- if and $encryption.keyringSecret.name (not (hasKey $cfg "CREDENTIAL_VAULT_KEYRING_FILE")) -}}
{{- $_ := set $cfg "CREDENTIAL_VAULT_KEYRING_FILE" (printf "/var/run/secrets/harakiri-vault/%s" $encryption.keyringSecret.key) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harakiri.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harakiri.labels" . | nindent 4 }}
data:
{{- range $key, $value := $cfg }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
