apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harakiri.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harakiri.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "harakiri.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "harakiri.selectorLabels" . | nindent 8 }}
        {{- if .Values.openshift.restricted }}
        harakiri.io/role: control-plane
        {{- end }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "harakiri.serviceAccountName" . }}
      {{- if kindIs "bool" .Values.serviceAccount.automountServiceAccountToken }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}
      {{- with (include "harakiri.imagePullSecrets" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "harakiri.image.api" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.api.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          {{- if .Values.metrics.enabled }}
          env:
            - name: OPERATOR_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrics.tokenSecret.name | quote }}
                  key: {{ .Values.metrics.tokenSecret.key | quote }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "harakiri.configMapName" . }}
            - secretRef:
                name: {{ include "harakiri.secretName" . }}
          {{- if or .Values.credentialVault.encryption.keyringSecret.name .Values.temporaryStorage.enabled .Values.trustBundle.configMapName }}
          volumeMounts:
            {{- include "harakiri.operatorMounts" . | nindent 12 }}
            {{- if .Values.credentialVault.encryption.keyringSecret.name }}
            - name: credential-vault-keyring
              mountPath: /var/run/secrets/harakiri-vault
              readOnly: true
            {{- end }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.credentialVault.encryption.keyringSecret.name .Values.temporaryStorage.enabled .Values.trustBundle.configMapName }}
      volumes:
        {{- include "harakiri.operatorVolumes" . | nindent 8 }}
        {{- if .Values.credentialVault.encryption.keyringSecret.name }}
        - name: credential-vault-keyring
          secret:
            secretName: {{ .Values.credentialVault.encryption.keyringSecret.name | quote }}
            items:
              - key: {{ .Values.credentialVault.encryption.keyringSecret.key | quote }}
                path: {{ .Values.credentialVault.encryption.keyringSecret.key | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
