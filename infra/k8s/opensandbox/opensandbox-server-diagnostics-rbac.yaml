apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensandbox-server-diagnostics
  namespace: opensandbox
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensandbox-server-diagnostics
  namespace: opensandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensandbox-server-diagnostics
subjects:
  - kind: ServiceAccount
    name: opensandbox-server
    namespace: opensandbox-system
