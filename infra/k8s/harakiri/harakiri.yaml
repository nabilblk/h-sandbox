apiVersion: v1
kind: Secret
metadata:
  name: harakiri-api
  namespace: harakiri
type: Opaque
stringData:
  DATABASE_URL: postgres://harakiri:harakiri@harakiri-postgres.harakiri.svc.cluster.local:5432/harakiri
  OPEN_SANDBOX_API_KEY: dev-opensandbox-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harakiri-config
  namespace: harakiri
data:
  API_PORT: "8080"
  PUBLIC_API_URL: "http://harakiri-api.harakiri.svc.cluster.local:8080"
  PUBLIC_KEYCLOAK_URL: "http://127.0.0.1:18084"
  PUBLIC_KEYCLOAK_REALM: "harakiri"
  PUBLIC_KEYCLOAK_CLIENT_ID: "harakiri-web"
  PUBLIC_OPEN_SANDBOX_URL: "http://127.0.0.1:18083"
  SANDBOX_ROUTE_MODE: "opensandbox-gateway"
  SANDBOX_ROUTE_BASE_DOMAIN: "harakiri.io"
  SANDBOX_ROUTE_PUBLIC_SCHEME: "https"
  SANDBOX_ROUTE_LOCAL_FALLBACK_URL: "http://127.0.0.1:18083"
  SANDBOX_MAX_ROUTES_PER_SANDBOX: "8"
  SANDBOX_MAX_ROUTES_PER_ORG: "200"
  TEMPLATE_MAX_CPU_COUNT: "8"
  TEMPLATE_MAX_MEMORY_MB: "32768"
  TEMPLATE_MAX_DEFAULT_PORTS: "16"
  TEMPLATE_BUILD_MAX_ACTIVE_PER_ORG: "3"
  TEMPLATE_IMAGE_ALLOW_REGISTRIES: "docker.io,registry-1.docker.io,mcr.microsoft.com,gcr.io,ghcr.io,127.0.0.1:5000,harakiri-registry.harakiri.svc.cluster.local:5000"
  TEMPLATE_IMAGE_DENY_REGISTRIES: ""
  TEMPLATE_IMAGE_ALLOW_PREFIXES: ""
  TEMPLATE_IMAGE_DENY_PREFIXES: ""
  TEMPLATE_BUILD_CONTEXT_MAX_BYTES: "26214400"
  TEMPLATE_BUILDER_NAMESPACE: "harakiri"
  TEMPLATE_BUILDER_JOB_IMAGE: "127.0.0.1:5000/harakiri/system/api:dev"
  TEMPLATE_BUILDER_KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.24.0"
  TEMPLATE_BUILDER_JOB_TIMEOUT_MS: "900000"
  TEMPLATE_REGISTRY_PUSH_HOST: "harakiri-registry.harakiri.svc.cluster.local:5000"
  TEMPLATE_REGISTRY_RUNTIME_HOST: "127.0.0.1:5000"
  TEMPLATE_REGISTRY_REPOSITORY_PREFIX: "harakiri/templates"
  TEMPLATE_REGISTRY_CREDENTIAL_KEY: "harakiri-local-registry-credential-key"
  TEMPLATE_SCANNER_WEBHOOK_URL: ""
  TEMPLATE_SCANNER_TIMEOUT_MS: "10000"
  TEMPLATE_SCANNER_FAIL_ON_ERROR: "0"
  TEMPLATE_RUNTIME_PULL_PREFLIGHT_ENABLED: "1"
  TEMPLATE_RUNTIME_PULL_PREFLIGHT_NAMESPACE: "opensandbox"
  TEMPLATE_RUNTIME_PULL_PREFLIGHT_TIMEOUT_MS: "120000"
  TEMPLATE_RETENTION_ENABLED: "1"
  TEMPLATE_RETENTION_INTERVAL_MS: "3600000"
  TEMPLATE_BUILD_RETENTION_DAYS: "30"
  TEMPLATE_BUILD_LOG_RETENTION_DAYS: "14"
  TEMPLATE_BUILD_CONTEXT_RETENTION_DAYS: "7"
  TEMPLATE_VERSION_RETENTION_DAYS: "90"
  TEMPLATE_BUILDER_JOB_RETENTION_DAYS: "1"
  TEMPLATE_RETENTION_DELETE_BUILDER_JOBS: "1"
  TEMPLATE_BUILDER_POLL_MS: "5000"
  KEYCLOAK_ISSUER: "http://keycloak.keycloak.svc.cluster.local:8080/realms/harakiri"
  KEYCLOAK_ISSUER_ALLOWLIST: "http://keycloak.keycloak.svc.cluster.local:8080/realms/harakiri,http://127.0.0.1:18084/realms/harakiri"
  KEYCLOAK_JWKS_URL: "http://keycloak.keycloak.svc.cluster.local:8080/realms/harakiri/protocol/openid-connect/certs"
  OPEN_SANDBOX_BASE_URL: "http://opensandbox-server.opensandbox-system.svc.cluster.local:80"
  OPEN_SANDBOX_ALLOW_FALLBACK: "0"
  AUTH_DEV_ALLOW: "0"
  AUTO_MIGRATE: "1"
  SEED_ON_BOOT: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harakiri-template-builder
  namespace: harakiri
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harakiri-template-builder
  namespace: harakiri
subjects:
  - kind: ServiceAccount
    name: default
    namespace: harakiri
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harakiri-template-builder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harakiri-registry
  namespace: harakiri
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: harakiri-registry
  template:
    metadata:
      labels:
        app: harakiri-registry
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: harakiri-registry
  namespace: harakiri
spec:
  selector:
    app: harakiri-registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harakiri-api
  namespace: harakiri
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harakiri-api
  template:
    metadata:
      labels:
        app: harakiri-api
    spec:
      containers:
        - name: api
          image: 127.0.0.1:5000/harakiri/system/api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: harakiri-config
            - secretRef:
                name: harakiri-api
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harakiri-scheduler
  namespace: harakiri
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harakiri-scheduler
  template:
    metadata:
      labels:
        app: harakiri-scheduler
    spec:
      containers:
        - name: scheduler
          image: 127.0.0.1:5000/harakiri/system/api:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/api/dist/scheduler.js"]
          envFrom:
            - configMapRef:
                name: harakiri-config
            - secretRef:
                name: harakiri-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harakiri-template-builder
  namespace: harakiri
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harakiri-template-builder
  template:
    metadata:
      labels:
        app: harakiri-template-builder
    spec:
      containers:
        - name: template-builder
          image: 127.0.0.1:5000/harakiri/system/api:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/api/dist/template-builder.js"]
          envFrom:
            - configMapRef:
                name: harakiri-config
            - secretRef:
                name: harakiri-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harakiri-web
  namespace: harakiri
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harakiri-web
  template:
    metadata:
      labels:
        app: harakiri-web
    spec:
      containers:
        - name: web
          image: 127.0.0.1:5000/harakiri/system/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: harakiri-api
  namespace: harakiri
spec:
  selector:
    app: harakiri-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: harakiri-web
  namespace: harakiri
spec:
  selector:
    app: harakiri-web
  ports:
    - name: http
      port: 80
      targetPort: 80
