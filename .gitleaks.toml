title = "Harakiri source publication checks"

[extend]
useDefault = true

[[rules]]
id = "harakiri-api-key"
description = "Harakiri API key (including keys without an assignment context)"
regex = '''\bhk_(?:live|test)_[A-Za-z0-9_-]{32,}\b'''
keywords = ["hk_live_", "hk_test_"]
  [[rules.allowlists]]
  description = "Exact documented local-only seed, verified inactive on the public lab; guarded by the dev seed policy"
  condition = "AND"
  paths = ['''(^|/)(CLAUDE\.md|apps/api/src/seed\.ts|db/migrations/005_remove_seeded_control_plane_data\.sql|docs/(runbook|development|test-report)\.md|tests/conformance/dev-runtime-smoke\.sh|tests/e2e/harakiri\.spec\.ts)$''']
  regexes = ['''^hk_live_demo_lyra_labs_0000000000000000000000000000000000$''']
  [[rules.allowlists]]
  description = "Exact browser fixture returned only by Playwright request interception"
  condition = "AND"
  paths = ['''(^|/)tests/e2e/authorization\.spec\.ts$''']
  regexes = ['''^hk_live_ui_fixture_not_a_real_credential_abcd$''']
  [[rules.allowlists]]
  description = "Original static mockup explicitly ends in REDACTED; no stored key matches"
  condition = "AND"
  paths = ['''(^|/)sandbox_mockups/components/onboarding\.jsx$''']
  regexes = ['''^hk_live_28fcf__c81ed_b0a4e_771b3_44a09_REDACTED$''']

[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  description = "Route identifier, not an authentication credential"
  condition = "AND"
  paths = ['''(^|/)(apps/api/src/route-targets\.test\.ts|packages/cli/src/command\.test\.ts)$''']
  regexes = ['''^sbx-route-5173$''']
  [[rules.allowlists]]
  description = "CLI syntax selecting stdin input; contains no key value"
  condition = "AND"
  paths = ['''(^|/)packages/cli/src/command\.test\.ts$''']
  regexes = ['''^from-stdin=true$''']
  [[rules.allowlists]]
  description = "Recorded OpenAPI checksum, verified metadata rather than a credential"
  condition = "AND"
  paths = ['''(^|/)apps/demo-video/public/capture/capture\.json$''']
  regexes = ['''^1383e9e011f000e77fbaca565821c91a497ae8c25d398dd64fe494561780ddff$''']
  [[rules.allowlists]]
  description = "Exact September 9 UI-tour source SHA-256 checksums, recomputed from the named frontend files; not API credentials"
  condition = "AND"
  paths = ['''(^|/)(apps/demo-video/public/ui-product-tour/tour\.json|apps/web/public/demos/ui-product-tour/provenance\.json)$''']
  regexes = [
    '''^085c64ee172ac8721007a532226aa6d5fd6f4e073e3118fbdd25f1fe9fbccfb0$''',
    '''^f634074bc7b6036f7d03b1c30dff51978a49b3925a6316b196a8c050022c6918$''',
    '''^6a7103cb5bd7536bcee26bc177fdd90758e4f75287759cf5f87f9688512a78b3$''',
    '''^f89a4bc12b270bd3a41cd543a02b9c8a1b477fbc7b59ca854fdbc9a9a6018de7$''',
    '''^ac6241c7e3c4ec1f56066abf4556d14a39572edf5ed900ddb51d13c869161179$''',
    '''^aa7d12b9c9b403f4d03daf3da424a2b4a75877f7712cf3f70f6c4bb1b706e89d$''',
    '''^9a0d09b3604822d7963fe6294b900c11d2efe6a4fdf245ee1da2f260155d41cc$''',
  ]
  [[rules.allowlists]]
  description = "Exact masked keys in historical static design mockups"
  condition = "AND"
  paths = ['''(^|/)sandbox_mockups/components/(onboarding|dashboard)\.jsx$''']
  regexes = ['''^hk_live_28fcf__c81ed_b0a4e_771b3_44a09_REDACTED$''', '''^hk_live_28fcf__c81ed_b0a4e\.\.\.$''', '''^hk_live_28fcf\.\.\.c81ed$''', '''^hk_live_44a09\.\.\.771b3$''', '''^hk_test_991ab\.\.\.4c7d0$''']

[[rules]]
id = "curl-auth-header"
  [[rules.allowlists]]
  description = "Exact redaction unit-test sentinel"
  condition = "AND"
  paths = ['''(^|/)apps/api/src/redaction\.test\.ts$''']
  regexes = ['''^hk_test_nested$''']

[[rules]]
id = "curl-auth-user"
  [[rules.allowlists]]
  description = "Loopback-only OpenCode smoke process, including its downloadable source copy"
  condition = "AND"
  paths = ['''(^|/)examples/templates/opencode/smoke\.sh$''', '''(^|/)apps/web/public/demos/agent-workflows\.zip!agent-workflows/opencode/smoke\.sh$''']
  regexes = ['''^opencode:harakiri-smoke$''']
