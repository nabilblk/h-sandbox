name: Sandbox Workbench acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/shared/**"
      - "packages/sdk/**"
      - "db/migrations/**"
      - "pnpm-lock.yaml"
      - "infra/acceptance/**"
      - "infra/workbench-acceptance/**"
      - ".github/workflows/workbench-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: workbench-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-amd64:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Verify hermetic harness contracts
        run: node --test infra/acceptance/safety.test.mjs infra/acceptance/browser-session.test.mjs infra/workbench-acceptance/*.test.mjs
      - name: Bootstrap only a fresh GitHub-hosted native amd64 cluster
        timeout-minutes: 10
        run: node infra/acceptance/bootstrap.mjs
      - name: Qualify unpublished source API and web through Workbench
        timeout-minutes: 45
        run: node infra/workbench-acceptance/run.mjs
      - name: Clean only owned resources and credentials
        if: always()
        run: node infra/acceptance/cleanup.mjs
      - name: Export only sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: standalone-acceptance-report.json
          if-no-files-found: warn
          retention-days: 14
