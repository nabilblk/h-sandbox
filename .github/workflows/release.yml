name: Release (Harbor)

# Publishes the control-plane container images and the Helm chart to Harbor.
#
# Triggers:
#   - manual run from main with a reviewed version tag or commit
#
# Required configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:   HARBOR_USERNAME, HARBOR_PASSWORD   (use a Harbor robot account, not admin)
#   Variables (optional, have defaults):
#     HARBOR_REGISTRY (default core.campus.clusterdiali.me)
#     HARBOR_PROJECT  (default harakiri)
#     WEB_PUBLIC_API_URL / WEB_PUBLIC_KEYCLOAK_URL / WEB_PUBLIC_KEYCLOAK_REALM /
#     WEB_PUBLIC_KEYCLOAK_CLIENT_ID / WEB_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO
#       -> OPTIONAL build-time fallback baked into the web bundle. The web image
#          is runtime-configured by the chart (config.PUBLIC_* -> /config.js at
#          startup), so these are only used when a runtime value is empty.

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Version tag or full commit SHA on main (empty uses workflow commit)"
        required: false
        default: ""
      image_tag:
        description: "Extra image tag to publish (e.g. a branch build). Optional."
        required: false
        default: ""
      chart_version:
        description: "Chart version override (SemVer, no leading v). Optional."
        required: false
        default: ""
      platforms:
        description: "Image platforms"
        required: false
        default: "linux/amd64,linux/arm64"
      component:
        description: "Publish all components and chart, or a single image only"
        type: choice
        options: [all, api, web]
        required: true
        default: all

# Least privilege: we push to Harbor with secrets, not to GHCR, so no write scopes.
permissions:
  contents: read

# Never run two releases for the same ref at once; don't cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY || 'core.campus.clusterdiali.me' }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || 'harakiri' }}

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.repository == vars.RELEASE_REPOSITORY
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      version: ${{ steps.source.outputs.version }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate immutable source before publication credentials are available
        id: source
        env:
          RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY }}
          RELEASE_SOURCE_REF: ${{ inputs.release_ref }}
          RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_CHART_VERSION: ${{ inputs.chart_version }}
          RELEASE_COMPONENT: ${{ inputs.component }}
        run: node scripts/check-release-source.mjs
      - name: Refuse existing or unverifiable candidate artifacts
        env:
          RELEASE_CHECK_ARTIFACTS: "1"
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_IMAGE_TAG: ${{ inputs.image_tag }}
        run: node scripts/check-release-artifacts.mjs

  images:
    name: Build & push ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: validate
    # Scope Harbor credentials to a protected environment for extra review/control.
    environment: harbor
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.component == 'web' && '["web"]' || inputs.component == 'api' && '["api"]' || '["api","web"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/harakiri-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }},enable=${{ inputs.image_tag == '' }}
            type=raw,value=sha-${{ needs.validate.outputs.short_sha }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.prerelease == 'false' && inputs.image_tag == '' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Compose web build args
        id: bargs
        run: |
          if [ "${{ matrix.component }}" = "web" ]; then
            {
              echo 'args<<EOF'
              echo "VITE_PUBLIC_API_URL=${{ vars.WEB_PUBLIC_API_URL || 'http://127.0.0.1:18082' }}"
              echo "VITE_PUBLIC_KEYCLOAK_URL=${{ vars.WEB_PUBLIC_KEYCLOAK_URL || 'http://127.0.0.1:18084' }}"
              echo "VITE_PUBLIC_KEYCLOAK_REALM=${{ vars.WEB_PUBLIC_KEYCLOAK_REALM || 'harakiri' }}"
              echo "VITE_PUBLIC_KEYCLOAK_CLIENT_ID=${{ vars.WEB_PUBLIC_KEYCLOAK_CLIENT_ID || 'harakiri-web' }}"
              echo "VITE_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO=${{ vars.WEB_PUBLIC_KEYCLOAK_SILENT_CHECK_SSO || 'false' }}"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          pull: true
          file: apps/${{ matrix.component }}/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.bargs.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Harbor's default config rejects OCI referrer/attestation artifacts;
          # keep these off unless your Harbor has OCI 1.1 referrers enabled.
          provenance: false
          sbom: false

  chart:
    name: Package & push Helm chart
    # A single-image hotfix must not publish an incomplete product chart.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.component == 'all' || inputs.component == '' }}
    runs-on: ubuntu-latest
    environment: harbor
    needs: [validate, images]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Resolve chart version
        id: ver
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version: $RELEASE_VERSION"

      - name: Lint chart
        run: helm lint infra/charts/harakiri

      - name: Package chart
        run: |
          helm package infra/charts/harakiri \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination dist

      - name: Log in to Harbor (Helm OCI)
        # Pass creds via env, not ${{ }} interpolation, so the shell doesn't
        # re-expand a username containing '$' (e.g. robot$project+name).
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | \
            helm registry login "$HARBOR_REGISTRY" \
              --username "$HARBOR_USERNAME" \
              --password-stdin

      - name: Push chart
        run: |
          helm push "dist/harakiri-${{ steps.ver.outputs.version }}.tgz" \
            "oci://${HARBOR_REGISTRY}/${HARBOR_PROJECT}/charts"

      - name: Logout
        if: always()
        run: helm registry logout "${HARBOR_REGISTRY}" || true
