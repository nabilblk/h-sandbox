name: Framework compatibility watch

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  upstream:
    name: Unreleased upstream compatibility probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install the qualified baseline
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Probe current upstream versions only inside this disposable checkout
        run: |
          pnpm --filter @h-sandbox/deepagents update --latest deepagents @langchain/core @langchain/langgraph @langchain/langgraph-checkpoint-postgres langchain langsmith zod
          pnpm --filter @h-sandbox/deepagents typecheck
          pnpm --filter @h-sandbox/deepagents test:package
      - name: Report candidate dependency changes, not supported versions
        if: always()
        run: |
          echo 'This probe does not publish packages or change the supported compatibility matrix.' >> "$GITHUB_STEP_SUMMARY"
          git diff -- packages/deepagents/package.json >> "$GITHUB_STEP_SUMMARY"
