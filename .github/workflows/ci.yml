name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets:
    name: Publishable source and history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install verified scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan without printing or uploading secret-bearing findings
        run: |
          node --test scripts/check-secrets.test.mjs
          node scripts/check-secrets.mjs --history

  checks:
    runs-on: ubuntu-latest
    services:
      capacity-postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit workspace dependencies
        run: pnpm audit --audit-level=high

      - name: Check OpenAPI document
        run: pnpm openapi:check

      - name: Check Credential Vault security boundary
        run: pnpm credential-vault:check

      - name: Check documentation links
        run: pnpm docs:check

      - name: Release source and channel guards
        run: node --test scripts/check-release-source.test.mjs scripts/check-release-artifacts.test.mjs scripts/verify-npm-trust.test.mjs scripts/wait-npm-version.test.mjs infra/scripts/check-local-deploy.test.mjs

      - name: Check examples
        run: pnpm examples:check

      - name: Check template smoke scripts
        run: pnpm templates:check

      - name: Standalone installation, template release and local supervision contracts
        run: node --test scripts/deployment-boundary.test.mjs infra/keycloak/harakiri-realm.test.mjs infra/mirror/mirror-opensandbox-chart.test.mjs infra/templates/release.test.mjs infra/scripts/env/harakiri/local-services.test.mjs infra/preview/configure.test.mjs

      - name: Shared tests
        run: pnpm --filter @harakiri/shared test

      - name: SDK typecheck and tests
        run: pnpm --filter @h-sandbox/sdk typecheck && pnpm --filter @h-sandbox/sdk test

      - name: CLI typecheck and tests
        run: pnpm --filter @h-sandbox/cli typecheck && pnpm --filter @h-sandbox/cli test

      - name: API tests
        run: pnpm --filter @harakiri/api test

      - name: Capacity invariants and fault injection (real PostgreSQL)
        env:
          CAPACITY_TEST_REQUIRED: "1"
          SANDBOX_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: pnpm --filter @harakiri/api exec node --test --test-concurrency=1 --import tsx src/organization-capacity.test.ts src/capacity-faults.test.ts

      - name: Web typecheck and tests
        run: pnpm --filter @harakiri/web typecheck && pnpm --filter @harakiri/web test

      - name: Demo contract and fixture tests (no live access)
        run: pnpm demo:test && pnpm --filter @harakiri/demo-video typecheck

      - name: Workspace build
        run: pnpm build

      - name: SDK and CLI package smoke
        run: pnpm publish:local-check

      - name: API typecheck
        run: pnpm --filter @harakiri/api typecheck

  browser:
    name: Browser contracts (no live service credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Enable pnpm and install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build interface dependencies
        run: |
          pnpm --filter @harakiri/shared build
          pnpm --filter @h-sandbox/sdk build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify documentation, authorization UI and preview states
        env:
          HARAKIRI_E2E_MANAGED_SERVER: "1"
        run: pnpm exec playwright test tests/e2e/docs-experience.spec.ts tests/e2e/authorization.spec.ts tests/e2e/preview-readiness.spec.ts tests/e2e/capacity.spec.ts

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint chart
        run: |
          helm lint infra/charts/harakiri
          helm lint infra/charts/harakiri -f infra/openshift/values-openshift.yaml
          helm lint infra/charts/opensandbox

      - name: Render chart (default + ingress)
        run: |
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci > /dev/null
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci \
            --set ingress.enabled=true \
            --set ingress.web.host=app.example.com \
            --set ingress.api.host=api.example.com > /dev/null
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci \
            --set credentialVault.externalSecrets.kubernetes.enabled=true \
            --set 'credentialVault.externalSecrets.kubernetes.allowedNamespaces[0]=harakiri' \
            --set 'credentialVault.externalSecrets.kubernetes.allowedNames[0]=harakiri-vault-ci' \
            --set-json 'credentialVault.externalSecrets.kubernetes.allowedNamePrefixes=[]' > /dev/null
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci \
            --set credentialVault.encryption.keyringSecret.name=harakiri-vault-keyring > /dev/null

      - name: Render restricted OpenShift profile
        run: |
          rendered="$(mktemp)"
          helm template harakiri infra/charts/harakiri -n harakiri-security \
            -f infra/openshift/values-openshift.yaml \
            --set secret.data.DATABASE_URL=postgres://ci > "${rendered}"
          grep -q 'OPEN_SANDBOX_SEND_OPEN_NETWORK_POLICY: "0"' "${rendered}"
          if grep -q 'kind: SecurityContextConstraints' "${rendered}"; then
            echo "restricted profile must not create or modify an SCC" >&2
            exit 1
          fi

      - name: Render OpenSandbox chart values
        run: |
          helm template opensandbox \
            infra/charts/opensandbox \
            -n opensandbox-system \
            -f infra/k8s/opensandbox/opensandbox-values.yaml > /dev/null
          helm template opensandbox \
            infra/charts/opensandbox \
            -n opensandbox-system \
            -f infra/k8s/opensandbox/opensandbox-values.airgap.yaml > /dev/null

      - name: Package chart dry run
        run: |
          mkdir -p dist-charts
          helm package infra/charts/harakiri \
            --version 0.0.0-ci.${{ github.run_number }} \
            --app-version 0.0.0-ci.${{ github.run_number }} \
            --destination dist-charts

  dev-conformance:
    name: SDK/CLI conformance (dev provider)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: harakiri
          POSTGRES_USER: harakiri
          POSTGRES_PASSWORD: harakiri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harakiri"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run public SDK and CLI smoke against dev provider
        env:
          DATABASE_URL: postgres://harakiri:harakiri@127.0.0.1:5432/harakiri
        run: pnpm conformance:dev

      - name: Workspace, lifecycle and authorization PostgreSQL tests
        env:
          WORKSPACE_TEST_DATABASE_URL: postgres://harakiri:harakiri@127.0.0.1:5432/harakiri
          SANDBOX_TEST_DATABASE_URL: postgres://harakiri:harakiri@127.0.0.1:5432/harakiri
        run: pnpm --filter @harakiri/api exec tsx --test src/persistent-workspaces.test.ts src/sandbox-lease.test.ts src/authorization-postgres.test.ts

      - name: Mandatory PostgreSQL capacity admission proof
        env:
          CAPACITY_TEST_REQUIRED: "1"
          SANDBOX_TEST_DATABASE_URL: postgres://harakiri:harakiri@127.0.0.1:5432/harakiri
        run: pnpm --filter @harakiri/api exec tsx --test src/organization-capacity.test.ts

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Dry-run npm package publishing
        run: pnpm publish:dry-run

      - name: Build local npm tarballs
        run: pnpm pack:sdk && pnpm pack:cli

      - name: Package Helm chart
        run: |
          mkdir -p dist-charts
          helm package infra/charts/harakiri \
            --version 0.0.0-ci.${{ github.run_number }} \
            --app-version 0.0.0-ci.${{ github.run_number }} \
            --destination dist-charts

  images:
    name: Build ${{ matrix.component }} image (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (validate Dockerfile, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
