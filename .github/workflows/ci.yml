name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI document
        run: pnpm openapi:check

      - name: Check Credential Vault security boundary
        run: pnpm credential-vault:check

      - name: Check documentation links
        run: pnpm docs:check

      - name: Check examples
        run: pnpm examples:check

      - name: Check template smoke scripts
        run: pnpm templates:check

      - name: Shared tests
        run: pnpm --filter @harakiri/shared test

      - name: SDK typecheck and tests
        run: pnpm --filter @h-sandbox/sdk typecheck && pnpm --filter @h-sandbox/sdk test

      - name: CLI typecheck and tests
        run: pnpm --filter @h-sandbox/cli typecheck && pnpm --filter @h-sandbox/cli test

      - name: API tests
        run: pnpm --filter @harakiri/api test

      - name: Web typecheck and tests
        run: pnpm --filter @harakiri/web typecheck && pnpm --filter @harakiri/web test

      - name: Demo contract and fixture tests (no live access)
        run: pnpm demo:test && pnpm --filter @harakiri/demo-video typecheck

      - name: Workspace build
        run: pnpm build

      - name: SDK and CLI package smoke
        run: pnpm publish:local-check

      - name: API typecheck
        run: pnpm --filter @harakiri/api typecheck

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint infra/charts/harakiri
          helm lint infra/charts/harakiri -f infra/openshift/values-openshift.yaml

      - name: Render chart (default + ingress)
        run: |
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci > /dev/null
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci \
            --set ingress.enabled=true \
            --set ingress.web.host=app.example.com \
            --set ingress.api.host=api.example.com > /dev/null
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci \
            --set credentialVault.externalSecrets.kubernetes.enabled=true \
            --set 'credentialVault.externalSecrets.kubernetes.allowedNamespaces[0]=harakiri' \
            --set 'credentialVault.externalSecrets.kubernetes.allowedNames[0]=harakiri-vault-ci' \
            --set-json 'credentialVault.externalSecrets.kubernetes.allowedNamePrefixes=[]' > /dev/null
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci \
            --set credentialVault.encryption.keyringSecret.name=harakiri-vault-keyring > /dev/null

      - name: Render restricted OpenShift profile
        run: |
          rendered="$(mktemp)"
          helm template harakiri infra/charts/harakiri -n harakiri-security \
            -f infra/openshift/values-openshift.yaml \
            --set secret.data.DATABASE_URL=postgres://ci > "${rendered}"
          grep -q 'OPEN_SANDBOX_SEND_OPEN_NETWORK_POLICY: "0"' "${rendered}"
          if grep -q 'kind: SecurityContextConstraints' "${rendered}"; then
            echo "restricted profile must not create or modify an SCC" >&2
            exit 1
          fi

      - name: Render OpenSandbox chart values
        run: |
          helm template opensandbox \
            https://github.com/opensandbox-group/OpenSandbox/releases/download/helm/opensandbox/0.2.2/opensandbox-0.2.2.tgz \
            -n opensandbox-system \
            -f infra/k8s/opensandbox/opensandbox-values.yaml > /dev/null
          helm template opensandbox \
            https://github.com/opensandbox-group/OpenSandbox/releases/download/helm/opensandbox/0.2.2/opensandbox-0.2.2.tgz \
            -n opensandbox-system \
            -f infra/k8s/opensandbox/opensandbox-values.airgap.yaml > /dev/null

      - name: Package chart dry run
        run: |
          mkdir -p dist-charts
          helm package infra/charts/harakiri \
            --version 0.0.0-ci.${{ github.run_number }} \
            --app-version 0.0.0-ci.${{ github.run_number }} \
            --destination dist-charts

  dev-conformance:
    name: SDK/CLI conformance (dev provider)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: harakiri
          POSTGRES_USER: harakiri
          POSTGRES_PASSWORD: harakiri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harakiri"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run public SDK and CLI smoke against dev provider
        env:
          DATABASE_URL: postgres://harakiri:harakiri@127.0.0.1:5432/harakiri
        run: pnpm conformance:dev

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Dry-run npm package publishing
        run: pnpm publish:dry-run

      - name: Build local npm tarballs
        run: pnpm pack:sdk && pnpm pack:cli

      - name: Package Helm chart
        run: |
          mkdir -p dist-charts
          helm package infra/charts/harakiri \
            --version 0.0.0-ci.${{ github.run_number }} \
            --app-version 0.0.0-ci.${{ github.run_number }} \
            --destination dist-charts

  images:
    name: Build ${{ matrix.component }} image (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (validate Dockerfile, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
