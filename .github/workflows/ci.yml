name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OpenAPI document
        run: pnpm openapi:check

      - name: Check examples
        run: pnpm examples:check

      - name: Check template smoke scripts
        run: pnpm templates:check

      - name: Shared tests
        run: pnpm --filter @harakiri/shared test

      - name: SDK typecheck and tests
        run: pnpm --filter @h-sandbox/sdk typecheck && pnpm --filter @h-sandbox/sdk test

      - name: CLI typecheck and tests
        run: pnpm --filter @h-sandbox/cli typecheck && pnpm --filter @h-sandbox/cli test

      - name: SDK and CLI package smoke
        run: pnpm publish:local-check

      - name: API typecheck
        run: pnpm --filter @harakiri/api typecheck

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint infra/charts/harakiri

      - name: Render chart (default + ingress)
        run: |
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci > /dev/null
          helm template harakiri infra/charts/harakiri -n harakiri \
            --set secret.data.DATABASE_URL=postgres://ci \
            --set ingress.enabled=true \
            --set ingress.web.host=app.example.com \
            --set ingress.api.host=api.example.com > /dev/null

  images:
    name: Build ${{ matrix.component }} image (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (validate Dockerfile, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
