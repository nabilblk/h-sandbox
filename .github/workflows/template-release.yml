name: Release template images (Harbor)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/templates/**
      - infra/templates/**
      - .github/workflows/template-release.yml

permissions:
  contents: read
concurrency:
  group: template-release-${{ github.ref }}
  cancel-in-progress: false
env:
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY || 'core.campus.clusterdiali.me' }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || 'harakiri' }}

jobs:
  catalog:
    if: github.ref == 'refs/heads/main' && github.repository == vars.RELEASE_REPOSITORY
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.catalog.outputs.templates }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: catalog
        run: echo "templates=$(node infra/templates/release.mjs matrix)" >> "$GITHUB_OUTPUT"
  images:
    needs: catalog
    environment: harbor
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.catalog.outputs.templates) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build, smoke both UIDs, publish architecture candidate
        env:
          TEMPLATE_NAME: ${{ matrix.template.name }}
          TEMPLATE_PLATFORM: linux/${{ matrix.arch }}
          TEMPLATE_EVIDENCE_DIR: evidence
        run: |
          export TEMPLATE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Run-scoped architecture tags cannot overwrite a previous candidate.
          export HARBOR_PROJECT="${HARBOR_PROJECT}"
          node infra/templates/release.mjs check
          docker tag "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/templates/${TEMPLATE_NAME}:${TEMPLATE_TAG}" "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/templates/${TEMPLATE_NAME}:${TEMPLATE_TAG}-${{ matrix.arch }}"
          docker push "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/templates/${TEMPLATE_NAME}:${TEMPLATE_TAG}-${{ matrix.arch }}"
      - name: Record digest
        env:
          TEMPLATE_NAME: ${{ matrix.template.name }}
        run: |
          mkdir -p evidence
          docker buildx imagetools inspect "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/templates/${TEMPLATE_NAME}:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}" --format '{{json .Manifest}}' > "evidence/${TEMPLATE_NAME}-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: template-${{ matrix.template.name }}-${{ matrix.arch }}
          path: evidence/
  manifests:
    needs: [catalog, images]
    environment: harbor
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: ${{ fromJSON(needs.catalog.outputs.templates) }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Join tested architectures; never promote a Harakiri alias
        env:
          TEMPLATE_NAME: ${{ matrix.template.name }}
        run: |
          IMAGE="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/templates/${TEMPLATE_NAME}"
          TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
