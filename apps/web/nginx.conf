server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /docs/ {
    types { text/markdown md; application/json json; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~ ^/llms(?:-full)?\.txt$ {
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /demo/ {
    types {
      video/mp4 mp4;
      image/webp webp;
      text/vtt vtt;
      text/markdown md;
      text/html html;
      application/json json;
    }
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri =404;
  }

  location /demos/ {
    types {
      video/mp4 mp4;
      image/webp webp;
      text/vtt vtt;
      text/markdown md;
      text/html html;
      application/json json;
      application/zip zip;
    }
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri $uri/ =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
